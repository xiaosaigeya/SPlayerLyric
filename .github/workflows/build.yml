name: Build and Release

on:
  push:
    branches: ["master", "main"]
    tags:
      - "v*"
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, Win32]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC components
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $instPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $setupPath = Join-Path $instPath 'setup'
          $args = @('modify', '--installPath', $instPath, '--add', 'Microsoft.VisualStudio.Component.VC.ATL', '--add', 'Microsoft.VisualStudio.Component.VC.MFC', '--quiet', '--norestart', '--nocache')
          $p = Start-Process -FilePath (Join-Path $setupPath 'vs_installer.exe') -ArgumentList $args -Wait -PassThru
          Write-Host "installer exit: $($p.ExitCode)"

      - name: Build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: msbuild /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} SPlayerLyric.vcxproj

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPlayerLyric-${{ matrix.platform }}
          path: |
            **/Bin/${{ matrix.platform }}/${{ matrix.configuration }}/SPlayerLyric.dll
            **/Bin/${{ matrix.platform }}/${{ matrix.configuration }}/plugins/SPlayerLyric.dll

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Zip Artifacts
        run: |
          zip -r SPlayerLyric-x64.zip SPlayerLyric-x64
          zip -r SPlayerLyric-x86.zip SPlayerLyric-Win32

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            SPlayerLyric-x64.zip
            SPlayerLyric-x86.zip
          draft: false
          prerelease: false
