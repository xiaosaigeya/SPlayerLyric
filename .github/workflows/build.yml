name: Build and Release

on:
  push:
    branches: ["master", "main"]
    tags:
      - "v*"
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, Win32]

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC components
        shell: pwsh
        run: |
          # VS Installer 引导程序：独立安装器目录（不分 VS 版本）
          $setupExe = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
          if (-not (Test-Path $setupExe)) { $setupExe = "C:\Program Files\Microsoft Visual Studio\Installer\setup.exe" }
          Write-Host "using installer: $setupExe"
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $instPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          $argList = "modify --installPath `"$instPath`" --add Microsoft.VisualStudio.Component.VC.ATL --add Microsoft.VisualStudio.Component.VC.MFC --quiet --norestart --nocache"
          $p = Start-Process -FilePath $setupExe -ArgumentList $argList -Wait -PassThru
          Write-Host "installer exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit 1 }

      - name: Build
        working-directory: ${{env.GITHUB_WORKSPACE}}
        run: msbuild /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} SPlayerLyric.vcxproj

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SPlayerLyric-${{ matrix.platform }}
          path: |
            **/Bin/${{ matrix.platform }}/${{ matrix.configuration }}/SPlayerLyric.dll
            **/Bin/${{ matrix.platform }}/${{ matrix.configuration }}/plugins/SPlayerLyric.dll

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Display structure of downloaded files
        run: ls -R

      - name: Zip Artifacts
        run: |
          zip -r SPlayerLyric-x64.zip SPlayerLyric-x64
          zip -r SPlayerLyric-x86.zip SPlayerLyric-Win32

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            SPlayerLyric-x64.zip
            SPlayerLyric-x86.zip
          draft: false
          prerelease: false
